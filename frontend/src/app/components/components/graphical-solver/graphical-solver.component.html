<div class="mt-8 border border-gray-300 rounded-lg p-4 bg-white shadow-sm">
  <h2 class="text-xl font-bold text-center mb-4">Solução Gráfica</h2>
  
  <!-- Container do gráfico -->
  <div class="h-96 border border-dashed border-gray-400 rounded-md mb-6">
    <!-- Aqui vai o seu gráfico -->
  </div>
  
  <!-- Detalhes da solução -->
  <div class="bg-gray-50 p-4 rounded-md">
    <h3 class="text-lg font-semibold mb-2">Detalhes da Solução</h3>
    
    <div class="space-y-2">
      <p class="text-gray-700">
        <span class="font-medium">Função objetivo:</span> 
        <span>{{ problemData?.objective }} {{ problemData?.objectiveCoefficients[0] }}X₁ + {{ problemData?.objectiveCoefficients[1] }}X₂</span>
      </p>
      
      <p class="text-gray-700">
        <span class="font-medium">Ponto ótimo:</span> 
        <span>(X₁, X₂) = ...</span>
      </p>
      
      <p class="text-gray-700">
        <span class="font-medium">Valor ótimo:</span> 
        <span>Z = ...</span>
      </p>
    </div>
  </div>
</div>
