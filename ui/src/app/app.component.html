<div class="container mx-auto p-6 max-w-3xl">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-center mb-6">Solucionador de Programação Linear</h1>

        <form [formGroup]="linearProgrammingForm" class="space-y-6">

            <!-- Objetivo -->
            <div class="flex items-center gap-4">
                <mat-form-field appearance="outline" class="w-48">
                    <mat-label>Objetivo</mat-label>
                    <mat-select formControlName="objective">
                        <mat-option *ngFor="let option of objectiveOptions" [value]="option">
                            {{ option }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <!-- Coeficientes da função objetivo -->
                <div class="flex items-center">
                    <mat-form-field appearance="outline" class="w-24">
                        <mat-label>Coeficiente</mat-label>
                        <input matInput type="text" [formControl]="objectiveCoefficients.controls[0]">
                        <mat-error *ngIf="objectiveCoefficients.controls[0].invalid">Valor numérico
                            requerido</mat-error>
                    </mat-form-field>

                    <span class="mx-2 font-medium">X₁ +</span>

                    <mat-form-field appearance="outline" class="w-24">
                        <mat-label>Coeficiente</mat-label>
                        <input matInput type="text" [formControl]="objectiveCoefficients.controls[1]">
                        <mat-error *ngIf="objectiveCoefficients.controls[1].invalid">Valor numérico
                            requerido</mat-error>
                    </mat-form-field>

                    <span class="mx-2 font-medium">X₂</span>
                </div>
            </div>

            <!-- Restrições -->
            <div class="border-t pt-4">
                <h2 class="text-xl font-semibold mb-4">Restrições</h2>

                <div formArrayName="constraints" class="space-y-4">
                    <div *ngFor="let constraint of constraints.controls; let i = index" class="flex items-center gap-2">
                        <div [formGroup]="constraint" class="flex items-center">

                            <!-- Coef das restrições -->
                            <div formArrayName="coefficients" class="flex items-center">

                                <mat-form-field appearance="outline" class="w-24">
                                    <mat-label>Coef. X₁</mat-label>
                                    <input matInput type="text"
                                        [formControl]="getConstraintCoefficients(i).controls[0]">
                                    <!-- <mat-error *ngIf="getConstraintCoefficients(i).controls[0].invalid">Valor numérico requerido</mat-error> -->
                                </mat-form-field>

                                <span class="mx-2 font-medium">X₁ +</span>

                                <mat-form-field appearance="outline" class="w-24">
                                    <mat-label>Coef. X₂</mat-label>
                                    <input matInput type="text"
                                        [formControl]="getConstraintCoefficients(i).controls[1]">
                                    <!-- <mat-error *ngIf="getConstraintCoefficients(i).controls[1].invalid">Valor numérico requerido</mat-error> -->
                                </mat-form-field>

                                <span class="mx-2 font-medium">X₂</span>

                            </div>

                            <mat-form-field appearance="outline" class="w-20">
                                <mat-select formControlName="operator">
                                    <mat-option *ngFor="let op of operatorOptions" [value]="op">{{ op }}</mat-option>
                                </mat-select>
                            </mat-form-field>

                            <mat-form-field appearance="outline" class="w-24">
                                <mat-label>Valor</mat-label>
                                <input matInput type="text" formControlName="value">
                                <!-- <mat-error *ngIf="constraint.get('value')?.invalid">Valor numérico requerido</mat-error> -->
                            </mat-form-field>

                        </div>
                    </div>
                </div>

                <!-- Botões para adicionar/remover restrições -->
                <div class="flex justify-center mt-4 gap-2">
                    <button mat-mini-fab color="warn" type="button" (click)="removeConstraint()"
                        aria-label="Remover restrição" class="flex items-center justify-center">
                        <mat-icon>remove</mat-icon>
                    </button>

                    <button mat-mini-fab color="primary" type="button" (click)="addConstraint()"
                        aria-label="Adicionar restrição" class="flex items-center justify-center bg-green-600">
                        <mat-icon>add</mat-icon>
                    </button>
                </div>
            </div>

            <!-- Não-negatividade -->
            <div class="text-center font-medium mt-4">
                X₁, X₂ ≥ 0
            </div>

            <!-- Botões de ação, os botoes gráfico e matemático devem acionar suas respectivas funções que ainda não estão implementadas, pois a função solveProblem é genérica -->
            <div class="flex justify-center gap-4 mt-6">
                <button mat-raised-button color="primary" (click)="solveGraphically()"
                    aria-label="Resolver Graficamente">
                    Gráfico
                </button>
                <button mat-raised-button color="accent" (click)="solveMathematically()"
                    aria-label="Resolver Matematicamente">
                    Matemático
                </button>
                <button mat-raised-button color="warn" type="button" (click)="resetForm()">
                    Resetar
                </button>
            </div>

        </form>


        <!-- Área de Gráfico -->
        <!-- <div #plotlyGraph></div> -->
        <!-- Área de Solução Matemática -->

            <p><strong>Valor ótimo:</strong> {{ mathematicalSolution.valor_otimo }}</p>
            <div *ngFor="let v of mathematicalSolution.variaveis | keyvalue">
                <p><strong>{{ v.key }}:</strong> {{ v.value }}</p>
            </div>
        </div> -->

    </div>
</div>
